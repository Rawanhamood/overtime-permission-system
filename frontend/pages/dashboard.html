<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - نظام تصاريح العمل</title>
    <style>
        /* ========== RESET & BASE STYLES ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fb 0%, #e3edf7 100%);
            color: #2c3e50;
            min-height: 100vh;
        }
        
        /* ========== NAVBAR STYLES ========== */
        .navbar {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        
        .logo {
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo-icon {
            background: #fff;
            color: #3498db;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .nav-links {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .nav-link {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .nav-link:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-2px);
        }
        
        .nav-link.active {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255,255,255,0.1);
            padding: 8px 20px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
        }
        
        .user-details {
            text-align: right;
        }
        
        .user-name {
            font-weight: 600;
            font-size: 16px;
        }
        
        .user-role {
            font-size: 13px;
            opacity: 0.9;
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
        }
        
        /* ========== NOTIFICATION SYSTEM ========== */
        .notification-container {
            position: relative;
        }
        
        .notification-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .notification-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.05);
        }
        
        .notification-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff4757;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            border: 2px solid #2c3e50;
        }
        
        .notifications-panel {
            position: fixed;
            top: 80px;
            right: 20px;
            width: 400px;
            max-width: 90vw;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            z-index: 1001;
            overflow: hidden;
            display: none;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px) translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0) translateX(0);
            }
        }
        
        .notifications-header {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .notifications-header h3 {
            font-size: 18px;
            font-weight: 600;
        }
        
        .notifications-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .notification-item {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: flex-start;
            gap: 15px;
            transition: all 0.3s ease;
        }
        
        .notification-item:hover {
            background: #f8fafc;
        }
        
        .notification-item.unread {
            background: #f0f7ff;
            border-right: 4px solid #3498db;
        }
        
        .notification-icon {
            font-size: 20px;
            flex-shrink: 0;
        }
        
        .notification-content {
            flex: 1;
        }
        
        .notification-title {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 4px;
        }
        
        .notification-message {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .notification-time {
            color: #95a5a6;
            font-size: 12px;
            margin-top: 5px;
        }
        
        .notification-actions {
            margin-top: 8px;
            display: flex;
            gap: 10px;
        }
        
        .btn-mark-read, .btn-view-permit {
            padding: 4px 12px;
            border-radius: 4px;
            border: none;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-mark-read {
            background: #3498db;
            color: white;
        }
        
        .btn-view-permit {
            background: #2ecc71;
            color: white;
        }
        
        .notifications-empty {
            padding: 50px 20px;
            text-align: center;
            color: #95a5a6;
        }
        
        /* ========== MAIN CONTENT ========== */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        
        /* ========== WELCOME SECTION ========== */
        .welcome-section {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border-radius: 20px;
            padding: 50px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            border: 1px solid rgba(52, 152, 219, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        .welcome-section::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            border-radius: 0 0 0 100%;
        }
        
        .welcome-content {
            position: relative;
            z-index: 1;
        }
        
        .welcome-title {
            font-size: 36px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        .welcome-subtitle {
            color: #7f8c8d;
            font-size: 18px;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto 40px;
        }
        
        /* ========== NEW BUTTONS SECTION ========== */
        .new-buttons-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        
        .new-permit-card {
            background: white;
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            border: 2px solid transparent;
            cursor: pointer;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .new-permit-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            border-color: #3498db;
        }
        
        .new-permit-card.overtime {
            background: linear-gradient(135deg, #f8fafc 0%, #e8f4ff 100%);
            border-left: 5px solid #2ecc71;
        }
        
        .new-permit-card.building {
            background: linear-gradient(135deg, #f8fafc 0%, #e8f4ff 100%);
            border-left: 5px solid #3498db;
        }
        
        .new-permit-card.material {
            background: linear-gradient(135deg, #fff5f5 0%, #ffe8e8 100%);
            border-left: 5px solid #e74c3c;
        }
        
        .new-permit-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            font-size: 36px;
            color: white;
        }
        
        .new-permit-card.building .new-permit-icon {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        }
        
        .new-permit-card.material .new-permit-icon {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }
        
        .new-permit-title {
            font-size: 24px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 15px;
        }
        
        .new-permit-description {
            color: #7f8c8d;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
            min-height: 60px;
        }
        
        .new-permit-btn {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
        }
        
        .new-permit-card.building .new-permit-btn {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
        }
        
        .new-permit-card.material .new-permit-btn {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
        }
        
        .new-permit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.4);
        }
        
        .new-permit-card.building .new-permit-btn:hover {
            box-shadow: 0 8px 25px rgba(52, 152, 219, 0.4);
        }
        
        .login-section {
            text-align: center;
            padding: 80px 20px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            border: 1px solid rgba(52, 152, 219, 0.1);
        }
        
        .login-title {
            font-size: 32px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 15px;
        }
        
        .login-description {
            color: #7f8c8d;
            font-size: 16px;
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto 30px;
        }
        
        .login-btn {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
            border: none;
            padding: 18px 40px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
        }
        
        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.4);
        }
        
        /* ========== DASHBOARD CARDS ========== */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }
        
        .dashboard-card {
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        
        .dashboard-card:hover {
            transform: translateY(-10px);
            border-color: #3498db;
            box-shadow: 0 20px 50px rgba(52, 152, 219, 0.15);
        }
        
        .dashboard-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #3498db 0%, #2980b9 100%);
        }
        
        .card-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .card-icon {
            width: 70px;
            height: 70px;
            border-radius: 15px;
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            flex-shrink: 0;
        }
        
        .card-title {
            font-size: 22px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        
        .card-description {
            color: #7f8c8d;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        
        .card-btn {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .card-btn:hover {
            background: linear-gradient(135deg, #2980b9 0%, #21618c 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.3);
        }
        
        /* ========== BUTTONS ========== */
        .logout-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .logout-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }
        
        /* ========== FOOTER ========== */
        .footer {
            text-align: center;
            padding: 40px 20px;
            color: #7f8c8d;
            border-top: 1px solid #e8f4ff;
            margin-top: 80px;
            background: white;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
        }
        
        .footer-title {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .footer-version {
            font-size: 14px;
            color: #95a5a6;
            margin-top: 15px;
        }
        
        /* ========== RESPONSIVE DESIGN ========== */
        @media (max-width: 1024px) {
            .main-container {
                padding: 20px;
            }
            
            .dashboard-grid {
                grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                gap: 25px;
            }
            
            .new-buttons-section {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }
            
            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .welcome-section {
                padding: 30px;
            }
            
            .welcome-title {
                font-size: 28px;
            }
            
            .welcome-subtitle {
                font-size: 16px;
                margin-bottom: 30px;
            }
            
            .new-buttons-section {
                gap: 20px;
            }
            
            .new-permit-card {
                padding: 25px;
            }
            
            .new-permit-icon {
                width: 70px;
                height: 70px;
                font-size: 32px;
                margin-bottom: 20px;
            }
            
            .new-permit-title {
                font-size: 20px;
            }
            
            .new-permit-description {
                font-size: 15px;
            }
            
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            
            .dashboard-card {
                padding: 25px;
            }
            
            .card-header {
                gap: 15px;
            }
            
            .card-icon {
                width: 60px;
                height: 60px;
                font-size: 28px;
            }
            
            .card-title {
                font-size: 20px;
            }
            
            .login-section {
                padding: 50px 20px;
            }
            
            .login-title {
                font-size: 26px;
            }
            
            .notifications-panel {
                width: 90%;
                right: 5%;
            }
        }
        
        @media (max-width: 480px) {
            .main-container {
                padding: 15px;
            }
            
            .welcome-section {
                padding: 25px;
            }
            
            .welcome-title {
                font-size: 24px;
            }
            
            .nav-link {
                padding: 8px 15px;
                font-size: 14px;
            }
            
            .notification-btn {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
            
            .new-permit-card {
                padding: 20px;
            }
            
            .dashboard-card {
                padding: 20px;
            }
            
            .card-header {
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }
            
            .card-icon {
                width: 50px;
                height: 50px;
                font-size: 24px;
            }
            
            .footer {
                padding: 30px 15px;
            }
        }
    </style>
</head>
<body>
    <!-- ========== NAVBAR ========== -->
    <nav class="navbar">
        <div class="logo">
            <div class="logo-icon">🚀</div>
            <span>نظام تصاريح العمل</span>
        </div>
        
        <div class="nav-links" id="navLinks">
            <!-- سيتم تعبئته ديناميكياً حسب دور المستخدم -->
        </div>
        
        <div class="user-info" id="userInfo">
            <div class="user-details">
                <div class="user-name">جاري التحميل...</div>
                <div class="user-role">...</div>
            </div>
            <div class="user-avatar" id="userAvatar">...</div>
        </div>
    </nav>

    <!-- ========== NOTIFICATIONS PANEL ========== -->
    <div id="notificationsPanel" class="notifications-panel">
        <div class="notifications-header">
            <h3>🔔 الإشعارات</h3>
            <button onclick="markAllNotificationsAsRead()" class="btn-mark-read" style="background: rgba(255,255,255,0.2);">
                تحديد الكل كمقروء
            </button>
            <button onclick="closeNotifications()" style="background: none; border: none; color: white; font-size: 20px; cursor: pointer;">
                ✕
            </button>
        </div>
        <div class="notifications-list" id="notificationsList"></div>
        <div class="notifications-empty" id="notificationsEmpty" style="display: none;">
            لا توجد إشعارات جديدة
        </div>
    </div>

    <!-- ========== MAIN CONTENT ========== -->
    <div class="main-container">
        <!-- Welcome / Login Section -->
        <div id="welcomeSection">
            <!-- سيتم تعبئته بالجافاسكريبت -->
        </div>
        
        <!-- زرين جديدين في وسط الصفحة (للموظفين فقط) -->
        <div id="newButtonsSection" class="new-buttons-section">
            <!-- سيتم تعبئته بالجافاسكريبت -->
        </div>
        
        <!-- Dashboard Cards Grid -->
        <div class="dashboard-grid" id="cardsGrid">
            <!-- سيتم تعبئته بالجافاسكريبت -->
        </div>
    </div>

    <!-- ========== FOOTER ========== -->
    <footer class="footer">
        <div class="footer-title">© 2024 نظام تصاريح العمل الإضافي</div>
        <p>نظام متكامل لإدارة تصاريح العمل بعد الدوام الرسمي في مبنى محافظة الداخلية</p>
        <div class="footer-version">الإصدار 1.0.0 | للاستخدام الداخلي</div>
    </footer>

    <script>
        // =============== SYSTEM INITIALIZATION ===============
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize the dashboard
            initDashboard();
            
            // Load notifications
            loadNotifications();
            
            // Setup notifications close on click outside
            setupNotificationsClose();
            
            // Start notification polling
            startNotificationPolling();
        });

        // =============== AUTHENTICATION FUNCTIONS ===============
        function getToken() {
            const token = localStorage.getItem('token');
            if (!token) {
                return null;
            }
            return token;
        }

        function getAuthHeaders() {
            const token = getToken();
            if (!token) return null;
            
            return {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            };
        }

        // =============== NOTIFICATIONS SYSTEM ===============
        let notificationCheckInterval;
        let lastUnreadNotifications = 0;

        function playNotificationSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.value = 880;
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                const now = ctx.currentTime;
                gain.gain.setValueAtTime(0.001, now);
                gain.gain.exponentialRampToValueAtTime(0.2, now + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                
                osc.start(now);
                osc.stop(now + 0.5);
            } catch (e) {
                console.warn('تعذر تشغيل صوت الإشعار:', e);
            }
        }

        function showNotifications() {
            const panel = document.getElementById('notificationsPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'block';
            if (panel.style.display === 'block') {
                loadNotifications();
                markAllNotificationsAsRead();
            }
        }

        function closeNotifications() {
            document.getElementById('notificationsPanel').style.display = 'none';
        }

        function setupNotificationsClose() {
            document.addEventListener('click', function(event) {
                const panel = document.getElementById('notificationsPanel');
                const bell = document.getElementById('notificationBell');
                
                if (panel && bell && !panel.contains(event.target) && !bell.contains(event.target)) {
                    panel.style.display = 'none';
                }
            });
        }

        async function loadNotifications() {
            const userData = JSON.parse(localStorage.getItem('user'));
            if (!userData) return;
            
            try {
                const headers = getAuthHeaders();
                if (!headers) return;
                
                const response = await fetch(`/api/notifications/${userData.username}`, {
                    method: 'GET',
                    headers: headers
                });
                
                const data = await response.json();
                
                if (data.success) {
                    renderNotifications(data.notifications);
                    updateBadge(data.unread_count);
                    
                    if (typeof data.unread_count === 'number' && data.unread_count > lastUnreadNotifications) {
                        playNotificationSound();
                    }
                    lastUnreadNotifications = data.unread_count || 0;
                }
            } catch (error) {
                console.error('خطأ في تحميل الإشعارات:', error);
            }
        }

        function renderNotifications(notifications) {
            const list = document.getElementById('notificationsList');
            const empty = document.getElementById('notificationsEmpty');
            
            if (!notifications || notifications.length === 0) {
                list.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            
            empty.style.display = 'none';
            
            list.innerHTML = notifications.map(notification => `
                <div class="notification-item ${notification.is_read ? '' : 'unread'}">
                    <div class="notification-icon">
                        ${getNotificationIcon(notification.type)}
                    </div>
                    <div class="notification-content">
                        <div class="notification-title">${notification.title}</div>
                        <div class="notification-message">${notification.message}</div>
                        <div class="notification-time">
                            ${formatTime(notification.created_at)}
                        </div>
                        ${!notification.is_read ? `
                            <div class="notification-actions">
                                <button class="btn-mark-read" onclick="markNotificationAsRead(${notification.notification_id})">
                                    تحديد كمقروء
                                </button>
                                ${notification.permit_id ? `
                                    <button class="btn-view-permit" onclick="viewPermit(${notification.permit_id})">
                                        عرض التصريح
                                    </button>
                                ` : ''}
                            </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        function getNotificationIcon(type) {
            const icons = {
                'success': '✅',
                'warning': '⚠️',
                'info': 'ℹ️'
            };
            return icons[type] || '📢';
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleString('ar-SA', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        async function markNotificationAsRead(notificationId) {
            const userData = JSON.parse(localStorage.getItem('user'));
            if (!userData) return;
            
            try {
                const headers = getAuthHeaders();
                if (!headers) return;
                
                await fetch('/api/notifications/mark-read', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        notification_id: notificationId,
                        username: userData.username
                    })
                });
                
                loadNotifications();
            } catch (error) {
                console.error('خطأ في تحديث الإشعار:', error);
            }
        }

        async function markAllNotificationsAsRead() {
            const userData = JSON.parse(localStorage.getItem('user'));
            if (!userData) return;
            
            try {
                const headers = getAuthHeaders();
                if (!headers) return;
                
                await fetch('/api/notifications/mark-all-read', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        username: userData.username
                    })
                });
                
                loadNotifications();
            } catch (error) {
                console.error('خطأ في تحديث الإشعارات:', error);
            }
        }

        function updateBadge(count) {
            const badge = document.getElementById('notificationBadge');
            if (badge) {
                if (count > 0) {
                    badge.textContent = count > 99 ? '99+' : count;
                    badge.style.display = 'flex';
                } else {
                    badge.style.display = 'none';
                }
            }
        }

        function viewPermit(permitId) {
            window.location.href = `/pages/my-permits.html?permit=${permitId}`;
        }

        function startNotificationPolling() {
            // Load notifications every 30 seconds
            notificationCheckInterval = setInterval(loadNotifications, 30000);
        }

        // =============== DASHBOARD INITIALIZATION ===============
        function initDashboard() {
            try {
                const userDataStr = localStorage.getItem('user');
                if (!userDataStr) {
                    // User is not logged in - show login section
                    showLoginSection();
                    return;
                }
                
                const userData = JSON.parse(userDataStr);
                
                if (!userData) {
                    showLoginSection();
                    return;
                }
                
                // User is logged in - update UI
                updateUserInfo(userData);
                createNavigationLinks(userData.role);
                showWelcomeSection(userData);
                createNewButtonsSection(userData.role);
                createDashboardCards(userData.role);
            } catch (error) {
                console.error('❌ خطأ في تهيئة Dashboard:', error);
                // إظهار رسالة خطأ بسيطة
                document.getElementById('welcomeSection').innerHTML = `
                    <div class="error-section" style="text-align: center; padding: 50px;">
                        <h2>حدث خطأ في تحميل الصفحة</h2>
                        <p>يرجى تحديث الصفحة أو تسجيل الدخول مرة أخرى</p>
                        <button onclick="window.location.href='/login'" style="padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer;">
                            تسجيل الدخول
                        </button>
                    </div>
                `;
            }
        }

        function createNavigationLinks(role) {
            const navLinks = document.getElementById('navLinks');
            let linksHTML = '';
            
            // رابط الرئيسية للجميع
            linksHTML += '<a href="/dashboard.html" class="nav-link active">🏠 الرئيسية</a>';
            
            // رابط نقطة الحراسة للحارس
            if (role === 'guard' || role === 'security_guard') {
                linksHTML += '<a href="/pages/security-guard.html" class="nav-link">👮 نقطة الحراسة</a>';
            } else if (role !== 'manager' && role !== 'guard' && role !== 'security_guard' && role !== 'security') {
                // رابط تصاريحي للجميع ما عدا الحارس والمدير ومسؤول الأمن
                linksHTML += '<a href="/pages/my-permits.html" class="nav-link">📋 تصاريحي</a>';
            }
            
            // روابط خاصة بالمديرين
            if (role === 'manager' || role === 'admin') {
                linksHTML += '<a href="/pages/manager-dashboard.html" class="nav-link">📊 لوحة المدير</a>';
            }
            
            // روابط خاصة بالأمن
            if (role === 'security' || role === 'admin') {
                linksHTML += '<a href="/pages/security-dashboard.html" class="nav-link">🔒 مكتب الأمن</a>';
            }
            
            // رابط إدارة الأقسام للمسؤولين فقط
            if (role === 'admin') {
                linksHTML += '<a href="/pages/manage-departments.html" class="nav-link">⚙️ إدارة الأقسام</a>';
            }
            
            // زر الإشعارات للجميع
            linksHTML += `
                <div class="notification-container">
                    <button onclick="showNotifications()" class="notification-btn" id="notificationBell">
                        🔔
                        <span id="notificationBadge" class="notification-badge" style="display: none;">0</span>
                    </button>
                </div>
            `;
            
            navLinks.innerHTML = linksHTML;
        }

        function showLoginSection() {
            document.getElementById('welcomeSection').innerHTML = `
                <div class="login-section">
                    <h1 class="login-title">🚀 مرحباً بك في نظام تصاريح العمل</h1>
                    <p class="login-description">
                        نظام متكامل لإدارة التصاريح <br>
                        تقديم الطلبات، المتابعة، والموافقة في مكان واحد
                    </p>
                    <a href="/login" class="login-btn">
                        <span>🔐</span>
                        تسجيل الدخول للبدء
                    </a>
                </div>
            `;
            
            document.getElementById('newButtonsSection').innerHTML = '';
            document.getElementById('cardsGrid').innerHTML = '';
        }

        function updateUserInfo(userData) {
            document.getElementById('userInfo').innerHTML = `
                <div class="user-details">
                    <div class="user-name">${userData.name || userData.username}</div>
                    <div class="user-role">${getRoleName(userData.role)}</div>
                </div>
                <div class="user-avatar">
                    ${(userData.name || userData.username).charAt(0)}
                </div>
                <button class="logout-btn" onclick="logout()">
                    <span>🚪</span>
                    تسجيل الخروج
                </button>
            `;
        }

        function showWelcomeSection(userData) {
            const currentTime = new Date().getHours();
            let greeting = 'مرحباً';
            
            if (currentTime < 12) {
                greeting = 'صباح الخير';
            } else if (currentTime < 18) {
                greeting = 'مساء الخير';
            } else {
                greeting = 'مساء الخير';
            }
            
            document.getElementById('welcomeSection').innerHTML = `
                <div class="welcome-section">
                    <div class="welcome-content">
                        <h1 class="welcome-title">
                            ${greeting}، ${userData.name || userData.username}! 👋
                        </h1>
                        <p class="welcome-subtitle">
                            مساء الخير، employees! أنت الآن في لوحة التحكم الرئيسية لنظام التصاريح.<br>
                            يمكنك من هنا الوصول إلى جميع الخدمات المتاحة حسب صلاحياتك.
                        </p>
                    </div>
                </div>
            `;
        }

        function createNewButtonsSection(role) {
            // إضافة زرين جديدين في وسط الصفحة للموظفين فقط
            if (role === 'employee') {
                document.getElementById('newButtonsSection').innerHTML = `
                    <div class="new-permit-card overtime" onclick="window.location.href='/pages/new-permit.html'">
                        <div class="new-permit-icon">🕒</div>
                        <h3 class="new-permit-title">طلب تصريح عمل إضافي</h3>
                        <p class="new-permit-description">
                            تقديم طلب جديد للعمل بعد الدوام الرسمي. سيتم إرساله إلى مديرك للموافقة.
                            <br>
                            <small style="font-size: 14px; color: #7f8c8d;">
                                للاستمرار وتواجد الموظف داخل العمل بعد ساعات الدوام الرسمي
                            </small>
                        </p>
                        <button class="new-permit-btn" onclick="event.stopPropagation(); window.location.href='/pages/new-permit.html'">
                            <span>➕</span>
                            تقديم طلب جديد
                        </button>
                    </div>
                    
                    <div class="new-permit-card building" onclick="window.location.href='/pages/company-entry-permit.html'">
                        <div class="new-permit-icon">🏢</div>
                        <h3 class="new-permit-title">طلب تصريح دخول المبنى للشركات</h3>
                        <p class="new-permit-description">
                            تقديم طلب للحصول على تصريح دخول إلى مبنى الشركة.
                            <br>
                            <small style="font-size: 14px; color: #7f8c8d;">
                                لدخول مباني الشركة خارج أوقات العمل الرسمية
                            </small>
                        </p>
                        <button class="new-permit-btn" onclick="event.stopPropagation(); window.location.href='/pages/company-entry-permit.html'">
                            <span>🏢</span>
                            تقديم طلب دخول
                        </button>
                    </div>
                    
                    <div class="new-permit-card material" onclick="window.location.href='/pages/material-exit-permit.html'">
                        <div class="new-permit-icon">📦</div>
                        <h3 class="new-permit-title">طلب إخراج مواد وأجهزة</h3>
                        <p class="new-permit-description">
                            تقديم طلب لإخراج مواد وأجهزة من مبنى محافظة الداخلية والنشآت التابعة لها.
                            <br>
                            <small style="font-size: 14px; color: #7f8c8d;">
                                لإخراج المواد والأجهزة من المبنى بعد الحصول على الموافقات المطلوبة
                            </small>
                        </p>
                        <button class="new-permit-btn" onclick="event.stopPropagation(); window.location.href='/pages/material-exit-permit.html'">
                            <span>📦</span>
                            تقديم طلب إخراج
                        </button>
                    </div>
                `;
            } else {
                document.getElementById('newButtonsSection').innerHTML = '';
            }
        }

        function createDashboardCards(role) {
            try {
                const cardsGrid = document.getElementById('cardsGrid');
                if (!cardsGrid) {
                    console.error('❌ عنصر cardsGrid غير موجود');
                    return;
                }
                
                let cardsHTML = '';
                
                // بطاقة نقطة الحراسة للحارس
                if (role === 'guard' || role === 'security_guard') {
                    cardsHTML += createCard(
                        '👮 نقطة الحراسة',
                        'تسجيل دخول وخروج الموظفين والشركات وإدارة التصاريح النشطة.',
                        '/pages/security-guard.html',
                        'الدخول للنقطة'
                    );
                }
            
            // Role-specific cards
            if (role === 'employee') {
                // تم نقل بطاقة "طلب تصريح جديد" إلى القسم العلوي
                // وبطاقة "طلب دخول المبنى" تم نقلها أيضاً
                
                // إضافة كرت تصاريحي للموظفين فقط
                cardsHTML += createCard(
                    '📋 تصاريحي',
                    'عرض جميع تصاريحك السابقة والحالية وتتبع حالة الطلبات الجديدة.',
                    '/pages/my-permits.html',
                    'تصاريح'
                );
            }
            
            if (role === 'manager') {
                cardsHTML += createCard(
                    '👨‍💼 لوحة المدير',
                    'الموافقة على طلبات الموظفين وإدارة تصاريح فريقك.',
                    '/pages/manager-dashboard.html',
                    'الدخول للوحة'
                );
            }
            
            if (role === 'security') {
                cardsHTML += createCard(
                    '🔒 لوحة الأمن',
                    'مراقبة التصاريح النشطة والتحقق من موظفي العمل الإضافي.',
                    '/pages/security-dashboard.html',
                    'الدخول للوحة'
                );
                
                cardsHTML += createCard(
                    '👁️ مراقبة الحضور',
                    'مراقبة وتسجيل أوقات الحضور والانصراف للموظفين.',
                    '#',
                    'عرض المراقبة'
                );
            }
            
            if (role === 'admin') {
                cardsHTML += createCard(
                    '⚙️ إدارة النظام',
                    'إدارة المستخدمين والإعدادات والنظام بالكامل.',
                    '#',
                    'إدارة النظام'
                );
                
                cardsHTML += createCard(
                    '📈 تقارير النظام',
                    'عرض تقارير مفصلة عن استخدام النظام والإحصائيات.',
                    '#',
                    'عرض التقارير'
                );
            }
            
            
                cardsGrid.innerHTML = cardsHTML;
                
                // Add click handlers to all cards
                setTimeout(() => {
                    document.querySelectorAll('.dashboard-card').forEach(card => {
                        card.addEventListener('click', function() {
                            const link = this.getAttribute('data-link');
                            if (link && link !== '#') {
                                window.location.href = link;
                            }
                        });
                    });
                }, 100);
            } catch (error) {
                console.error('❌ خطأ في إنشاء بطاقات Dashboard:', error);
            }
        }

        function createCard(title, description, link, buttonText) {
            const icon = title.match(/[^\w\s]/)?.[0] || '📄';
            
            return `
                <div class="dashboard-card" data-link="${link}">
                    <div class="card-header">
                        <div class="card-icon">${icon}</div>
                        <div>
                            <h3 class="card-title">${title}</h3>
                        </div>
                    </div>
                    <p class="card-description">${description}</p>
                    <button class="card-btn" onclick="event.stopPropagation(); window.location.href='${link}'">
                        ${buttonText}
                    </button>
                </div>
            `;
        }

        // =============== UTILITY FUNCTIONS ===============
        function getRoleName(role) {
            const roles = {
                'admin': 'مسؤول النظام',
                'employee': 'موظف',
                'manager': 'مدير',
                'security': 'مسؤول أمن'
            };
            return roles[role] || role;
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/login';
        }
    </script>
</body>
</html>
